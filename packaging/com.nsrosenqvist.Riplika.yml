# Flatpak manifest for Riplika.
#
# Everything the three pipelines need is built here. ffmpeg with libdvdread,
# libdvdnav and libdvdcss reads and encodes video; cdparanoia reads audio off a
# CD and LAME encodes it to MP3; a game disc needs neither, since it is copied
# rather than converted. A missing one of these does not announce itself at
# startup, so packaging/check-flatpak.sh asks for each by name.
#
# Two things the sandbox decides, which are worth stating plainly.
#
# MakeMKV cannot be bundled, being proprietary, so redistributing it in this
# manifest is not ours to do. Calling the host's copy would need
# --talk-name=org.freedesktop.Flatpak, which is sandbox escape wearing a hat:
# it would let this application run anything at all on the host, and claiming
# to be sandboxed afterwards would be a lie. A disc the free reader cannot
# manage therefore needs the native build with makemkvcon on PATH, and the
# window does not offer the option in here, since it could only sit greyed
# out. DVDs, music CDs and game discs all work in the sandbox, because none of
# those paths needs anything proprietary.
#
# --device=all is required and is not a small permission. Flatpak has no
# narrower option for an optical drive, since --device=dri is the GPU and
# there is nothing for /dev/sr0 alone. Reading a disc means access to devices
# generally, and the three permissions below it are each explained where they
# are asked for.
app-id: com.nsrosenqvist.Riplika
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: riplika-gui

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/riplika/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # the optical drive; see the note above
  - --device=all
  # catalogue lookups against TVmaze and TMDB
  - --share=network
  # Unmounting the disc before opening the tray.
  #
  # The kernel will not open a tray under a mounted filesystem, and the
  # desktop mounts a disc the moment it goes in. Unsandboxed, `eject` unmounts
  # first and none of this arises; in here the mount belongs to the host's
  # udisks, is not visible at all, and can only be undone by asking udisks to
  # undo it. Without this, ejecting a disc that has been looked at reports
  # "busy" and there is nothing the application can do about it.
  #
  # Narrow on purpose: one service, and the only thing asked of it is to
  # unmount the drive this application was pointed at. It is not
  # --filesystem=host wearing a different hat - udisks decides for itself
  # whether the caller may unmount, and asks the session if it is unsure.
  - --system-talk-name=org.freedesktop.UDisks2
  # Where the language data for reading a new disc's lettering was installed.
  # Tesseract has a compiled-in default and it is not this one, so without it a
  # disc nobody has a glyph table for gets "Error opening data file".
  - --env=TESSDATA_PREFIX=/app/share/tessdata
  # Noticing a disc going in or coming out, so the window follows the tray
  # rather than waiting to be asked to look again.
  #
  # GVolumeMonitor is how a GTK application is told; inside a sandbox it
  # reaches the desktop's copy through gvfs, and without this it sees no
  # drives at all and never fires. Read-only in effect: it is told what
  # happened and asks for nothing.
  - --talk-name=org.gtk.vfs.*
  # somewhere to write the library.
  #
  # xdg-download is not for the working rip, whatever the comment used to say:
  # that defaults to the application's own cache directory, which needs no
  # permission. It is here because a library or a scratch directory configured
  # under Downloads is a thing people do, and without it that configuration
  # fails at the end of a rip rather than when it is set.
  #
  # One per kind, because they are three different libraries and a disc goes to
  # the one that matches it. Without the music line a CD rip fails outright:
  # inside the sandbox ~/Music does not merely refuse to be written, it does
  # not exist, so the rip stops on a directory it cannot create.
  #
  # Games are not an XDG directory - there is no xdg-games - so the folder is
  # named outright. Somebody who configures a library somewhere else has to
  # grant that path themselves; flatpak has no way for the application to ask
  # for it, and --filesystem=home to avoid the question would hand it
  # everything.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=~/Games
  - --filesystem=xdg-download

modules:
  # --- disc reading -------------------------------------------------------
  # VideoLAN moved these three to meson; flatpak-builder assumes autotools.
  - name: libdvdcss
    buildsystem: meson
    # ffmpeg and x264 install to /app/lib, and meson picks its own libdir from
    # the host it thinks it is on - lib on one builder, lib64 on another. Saying
    # it means the build does not depend on which builder ran it.
    config-opts:
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  - name: libdvdread
    buildsystem: meson
    config-opts:
      # Linked, not dlopened. libdvdread falls back to loading libdvdcss by
      # name at runtime, which inside a sandbox depends on it being on the
      # loader path - linking removes the question.
      - -Dlibdvdcss=enabled
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    config-opts:
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  # --- the tools the pipeline drives --------------------------------------
  # The GNOME SDK carries no x264, and the encoder is not optional here: every
  # quality tier is an x264 CRF.
  - name: x264
    config-opts:
      - --enable-shared
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        # the stable branch, pinned - a branch name would drift
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # LAME, for MP3. ffmpeg has a FLAC encoder of its own and no MP3 one, so
  # without this a FLAC rip works, an MP3 rip gets as far as encoding and
  # fails on every track with "Encoder not found", and the settings screen
  # offers a format that cannot be produced.
  - name: lame
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-frontend
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
      # 3.100 exports a symbol its own source does not define, and the link
      # fails on it. Every distribution carries this same one-line removal.
      - type: shell
        commands:
          - sed -i '/lame_init_old/d' include/libmp3lame.sym

  # ffmpeg must be built --enable-libdvdnav --enable-libdvdread: without them
  # there is no dvdvideo demuxer and the application cannot read a disc at all.
  - name: ffmpeg
    config-opts:
      # GPL for x264, version3 for nothing in particular yet - but changing
      # licence terms later is worse than starting permissive enough.
      - --enable-gpl
      - --enable-version3
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --enable-ffmpeg
      - --enable-ffprobe
      - --enable-libdvdnav
      - --enable-libdvdread
      - --enable-libx264
      - --enable-libmp3lame
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz
        sha256: de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f

  # cdparanoia, for reading audio off a CD.
  #
  # Not optional and not interchangeable with ffmpeg, which can read a CD
  # through libcdio and does none of what makes a rip trustworthy: re-reads,
  # C2 error pointers, jitter correction against a drive that does not report
  # its position honestly. Without it every track of a music rip fails with
  # "cdparanoia: No such file or directory", which is exactly what it did.
  - name: cdparanoia
    buildsystem: simple
    build-commands:
      # Its own config.guess and config.sub are from 2008 and do not recognise
      # the triplet this is built for; the SDK carries current ones.
      - cp /usr/share/automake-*/config.sub /usr/share/automake-*/config.guess .
      - ./configure --prefix=/app
      # -fPIC because the shared library does not build without it here, and
      # -j1 because its Makefile is not safe to run in parallel.
      - make -j1 OPT="$CFLAGS -fPIC"
      - make install
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/cdparanoia/cdparanoia-III-10.2.src.tgz
        sha256: 005db45ef4ee017f5c32ec124f913a0546e77014266c6a1c50df902a55fe64df

  # Leptonica and Tesseract, for labelling a glyph table on a disc nobody has
  # one for. Not how subtitles are decoded - that is an exact lookup of shapes
  # already labelled and stays that way - but how the labels are arrived at
  # once per release font. Without it a disc from a studio the shipped table
  # does not cover keeps its subtitles as pictures, which is what The Lion King
  # did.
  - name: leptonica
    buildsystem: autotools
    config-opts:
      - --disable-static
      # Nothing here reads a scanned page: the input is a PNG this application
      # drew itself, moments earlier, from the shapes it segmented.
      - --without-jpeg
      - --without-giflib
      - --without-libwebp
      - --without-libopenjpeg
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.85.0/leptonica-1.85.0.tar.gz
        sha256: 3745ae3bf271a6801a2292eead83ac926e3a9bc1bf622e9cd4dd0f3786e17205

  - name: tesseract
    buildsystem: cmake-ninja
    # Its CMakeLists refuses to generate in the source directory, and
    # flatpak-builder builds in-source unless told otherwise.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.0.tar.gz
        sha256: f2fb34ca035b6d087a42875a35a7a5c4155fa9979c6132365b1e5a28ebc3fc11

  # A track is only ever read with its own language's data - reading Icelandic
  # with English votes `d` and `o` for one shape and `p` and `b` for another,
  # into the table every track on the disc shares - so a language that is not
  # here is a language whose subtitles stay pictures. Hence the spread: the
  # languages a Region 2 disc is actually subtitled in, at two to five
  # megabytes each.
  #
  # The fast models rather than the accurate ones. What they are asked to read
  # is a line this application rendered from its own segmentation - black on
  # white, no skew, no noise - and the difference between the two model sets
  # does not show on that, while the accurate ones are ten times the size.
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 eng.traineddata /app/share/tessdata/eng.traineddata
      - install -Dm644 swe.traineddata /app/share/tessdata/swe.traineddata
      - install -Dm644 deu.traineddata /app/share/tessdata/deu.traineddata
      - install -Dm644 fra.traineddata /app/share/tessdata/fra.traineddata
      - install -Dm644 spa.traineddata /app/share/tessdata/spa.traineddata
      - install -Dm644 ita.traineddata /app/share/tessdata/ita.traineddata
      - install -Dm644 nld.traineddata /app/share/tessdata/nld.traineddata
      - install -Dm644 dan.traineddata /app/share/tessdata/dan.traineddata
      - install -Dm644 nor.traineddata /app/share/tessdata/nor.traineddata
      - install -Dm644 fin.traineddata /app/share/tessdata/fin.traineddata
      - install -Dm644 isl.traineddata /app/share/tessdata/isl.traineddata
      - install -Dm644 por.traineddata /app/share/tessdata/por.traineddata
      - install -Dm644 pol.traineddata /app/share/tessdata/pol.traineddata
      - install -Dm644 ces.traineddata /app/share/tessdata/ces.traineddata
      - install -Dm644 hun.traineddata /app/share/tessdata/hun.traineddata
      - install -Dm644 ell.traineddata /app/share/tessdata/ell.traineddata
      - install -Dm644 rus.traineddata /app/share/tessdata/rus.traineddata
      - install -Dm644 tur.traineddata /app/share/tessdata/tur.traineddata
