# Flatpak manifest for Riplika.
#
# The sandbox shapes what this can be, in two ways worth stating plainly.
#
# MakeMKV cannot be bundled: it is proprietary, so redistributing it in this
# manifest is not ours to do. Calling the host's copy would need
# --talk-name=org.freedesktop.Flatpak, which is sandbox escape wearing a hat -
# it would let this application run anything at all on the host, and claiming
# to be sandboxed afterwards would be a lie. So the Flatpak is DVD-only, which
# is workable precisely because the DVD path needs nothing proprietary:
# libdvdread, libdvdnav and libdvdcss do the work, and ffmpeg exposes them.
# Blu-ray needs the native build with makemkvcon on PATH.
#
# --device=all is required and is not a small permission. Flatpak has no
# narrower option for an optical drive: --device=dri is the GPU, and there is
# nothing for /dev/sr0 alone. Reading a disc means access to devices generally.
app-id: com.nsrosenqvist.Riplika
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: riplika-gui

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/riplika/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # the optical drive; see the note above
  - --device=all
  # catalogue lookups against TVmaze and TMDB
  - --share=network
  # somewhere to write the library, and somewhere to put the working rip.
  #
  # One per kind, because they are three different libraries and a disc goes to
  # the one that matches it. Without the music line a CD rip fails outright:
  # inside the sandbox ~/Music does not merely refuse to be written, it does
  # not exist, so the rip stops on a directory it cannot create.
  #
  # Games are not an XDG directory - there is no xdg-games - so the folder is
  # named outright. Somebody who configures a library somewhere else has to
  # grant that path themselves; flatpak has no way for the application to ask
  # for it, and --filesystem=home to avoid the question would hand it
  # everything.
  - --filesystem=xdg-videos
  - --filesystem=xdg-music
  - --filesystem=~/Games
  - --filesystem=xdg-download

modules:
  # --- disc reading -------------------------------------------------------
  # VideoLAN moved these three to meson; flatpak-builder assumes autotools.
  - name: libdvdcss
    buildsystem: meson
    # ffmpeg and x264 install to /app/lib, and meson picks its own libdir from
    # the host it thinks it is on - lib on one builder, lib64 on another. Saying
    # it means the build does not depend on which builder ran it.
    config-opts:
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdcss/1.6.0/libdvdcss-1.6.0.tar.xz
        sha256: 7ea556c846b7bfc32d47b41cae56d1863a6b6d5f706bb162778d6f298490977c

  - name: libdvdread
    buildsystem: meson
    config-opts:
      # Linked, not dlopened. libdvdread falls back to loading libdvdcss by
      # name at runtime, which inside a sandbox depends on it being on the
      # loader path - linking removes the question.
      - -Dlibdvdcss=enabled
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdread/7.1.1/libdvdread-7.1.1.tar.xz
        sha256: a0d47876548bec806774bbf8dbf20bb19ba139464383156b32eb8e59915b90a9

  - name: libdvdnav
    buildsystem: meson
    config-opts:
      - --libdir=lib
    sources:
      - type: archive
        url: https://download.videolan.org/pub/videolan/libdvdnav/7.0.0/libdvdnav-7.0.0.tar.xz
        sha256: a2a18f5ad36d133c74bf9106b6445806fa253b09141a46392550394b647b221e

  # --- the tools the pipeline drives --------------------------------------
  # The GNOME SDK carries no x264, and the encoder is not optional here: every
  # quality tier is an x264 CRF.
  - name: x264
    config-opts:
      - --enable-shared
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        # the stable branch, pinned - a branch name would drift
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  # ffmpeg must be built --enable-libdvdnav --enable-libdvdread: without them
  # there is no dvdvideo demuxer and the application cannot read a disc at all.
  - name: ffmpeg
    config-opts:
      # GPL for x264, version3 for nothing in particular yet - but changing
      # licence terms later is worse than starting permissive enough.
      - --enable-gpl
      - --enable-version3
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --enable-ffmpeg
      - --enable-ffprobe
      - --enable-libdvdnav
      - --enable-libdvdread
      - --enable-libx264
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz
        sha256: de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f

  # No mkvtoolnix: the VobSub track is read out of Matroska directly, because
  # MKVToolNix wants Qt for every one of its tools and bundling Qt to obtain
  # `mkvextract` is a poor trade.

  # --- the application ----------------------------------------------------
  - name: riplika
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/riplika-gui /app/bin/riplika-gui
      - install -Dm755 target/release/riplika /app/bin/riplika
      - install -Dm644 data/com.nsrosenqvist.Riplika.desktop
          /app/share/applications/com.nsrosenqvist.Riplika.desktop
      # The name matters twice over: flatpak exports only icons named after the
      # app id, and the desktop entry's Icon= is that same name. Anywhere else
      # or anything else and the launcher shows a blank square.
      - install -Dm644 data/icons/hicolor/scalable/apps/com.nsrosenqvist.Riplika.svg
          /app/share/icons/hicolor/scalable/apps/com.nsrosenqvist.Riplika.svg
      # the translations, where i18n::init looks inside a sandbox
      - ./po/install.sh /app/share

    sources:
      - type: dir
        path: ..
      # generated with flatpak-cargo-generator.py from Cargo.lock
      - cargo-sources.json
