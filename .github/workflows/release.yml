# What happens when a version is tagged.
#
# The tag is the whole input: `v0.3.0` is a release, `v0.3.0-rc.1` is a
# pre-release, and nothing else distinguishes them. Everything the tag implies
# - whether GitHub marks it as a draft of the real thing - is read from it once
# and passed around, so there is no second place that could disagree about
# which release this is.
#
# The version itself is not written here. It is committed first and the tag put
# on that commit, by ./release.sh, and the jobs below only check that the tree
# they are building says what the tag says. Setting it here would build the
# right number and leave the tagged commit saying the old one.
#
# Two things are handed out. The flatpak is how somebody installs the window;
# the tarball is the pair of binaries for anybody who wants the command line,
# or Blu-ray, which the sandbox cannot do.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  # create the release and upload to it
  contents: write
  # chronikl writes the notes through GitHub Models
  models: read

# Two pushes of one tag must not both be making the release. No
# cancel-in-progress here, unlike CI: a half-made release is worse than a slow
# one, and the answer to "was this released" should not depend on timing.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # What the tag says, worked out once.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
    steps:
      - id: read
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Anything after the patch number - -rc.1, -beta.2 - says this is not
          # the finished thing, and GitHub is told so rather than left to guess
          # from the name.
          if [ "$VERSION" != "${VERSION%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a pre-release of $VERSION"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is release $VERSION"
          fi

  # A tag is not a push to a branch, so nothing has checked this code yet.
  # The same jobs CI runs, run again against exactly what is being released -
  # by calling CI rather than by keeping a second copy of it that could drift.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Binaries
    needs: [version, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/version-matches-tag
      - uses: ./.github/actions/gui-build-deps
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

      - name: Package
        run: |
          set -eu
          DIR="riplika-${{ needs.version.outputs.version }}-x86_64-linux"
          mkdir "$DIR"
          # Both binaries. The window and the command line are one program in
          # two front ends, and the command line is the one that can be
          # scripted or run over ssh.
          install -m755 target/release/riplika target/release/riplika-gui "$DIR/"
          strip "$DIR/riplika" "$DIR/riplika-gui"
          cp README.md LICENSE "$DIR/"
          # i18n::init looks for a locale tree beside the binary before it
          # looks at /app or /usr, so the tarball carries its own and works
          # wherever it is unpacked.
          ./po/install.sh "$DIR"
          tar czf "$DIR.tar.gz" "$DIR"
          echo "packaged $DIR.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: riplika-*.tar.gz

  flatpak:
    name: Flatpak
    needs: [version, checks]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/version-matches-tag
      # The same build CI does, asked to keep the result this time.
      - uses: ./.github/actions/flatpak-build
        with:
          repo: repo

      - name: Bundle
        run: |
          set -eu
          BUNDLE="riplika-${{ needs.version.outputs.version }}.flatpak"
          flatpak build-bundle repo "$BUNDLE" com.nsrosenqvist.Riplika
          echo "bundled $BUNDLE"

      - name: Manifest for Flathub
        # Built from the canonical manifest with the working-tree source
        # swapped for this tag, so the two cannot drift. Attached to the
        # release because a Flathub submission needs it and the cargo source
        # list beside it.
        run: |
          set -eu
          ./packaging/flathub-manifest.py "${GITHUB_REF_NAME}" \
            > com.nsrosenqvist.Riplika.yml
          cp packaging/cargo-sources.json .

      - uses: actions/upload-artifact@v6
        with:
          name: flatpak
          path: |
            riplika-*.flatpak
            com.nsrosenqvist.Riplika.yml
            cargo-sources.json

      # Publishing the remote, from the repository this job already has.
      #
      # Here rather than in a job of its own because that job would begin by
      # moving 240 MB through the artifact store to get back what is sitting
      # in this working directory. It is skipped when the credentials are
      # absent, so a fork tagging a release builds everything and publishes
      # nothing rather than failing on a secret it was never going to have.
      - name: Publish to the remote
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ secrets.R2_BUCKET }}
          BASE_URL: ${{ vars.REPO_BASE_URL }}
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends ostree

          # A keyring of its own, thrown away with the runner. Importing into
          # the default one would leave the key in a directory later steps
          # share.
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | base64 -d | gpg --batch --quiet --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "signing as $KEYID"

          # What is already published. The new build is another commit on the
          # ref every previous release used, and a repository built from
          # scratch here would drop the history `flatpak update` walks.
          mkdir -p published
          aws s3 sync "s3://$BUCKET/repo/" published/ \
            --endpoint-url "$ENDPOINT" --no-progress
          test -f published/config || ostree --repo=published init --mode=archive-z2
          # The directories an object store cannot hand back.
          #
          # S3 has no empty directories - only keys - so a repository fetched
          # from one arrives without refs/remotes, refs/mirrors, state or tmp,
          # all of which are empty here and none of which ostree creates on
          # demand. It gets as far as "Generating static deltas" and stops on
          # "opendir(refs/remotes): No such file or directory", which reads
          # like a corrupt repository and is nothing of the kind.
          mkdir -p published/refs/heads published/refs/mirrors \
                   published/refs/remotes published/state published/tmp

          # This application's ref, and nothing else. The build repository has
          # an appstream branch of its own listing one application, and
          # pulling that across would replace a catalogue of everything on the
          # remote with a catalogue of this. build-update-repo regenerates it
          # below from every app ref that is actually there.
          ostree --repo=published pull-local repo \
            app/com.nsrosenqvist.Riplika/x86_64/master

          flatpak build-sign published com.nsrosenqvist.Riplika \
            --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME"
          # Static deltas are what make an update a diff rather than the whole
          # application again. Two releases of history is enough to roll back
          # to; the rest is pruned and stops being paid for.
          flatpak build-update-repo published \
            --generate-static-deltas --prune --prune-depth=2 \
            --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME"

          # Objects are named after their own hashes and never change, so they
          # are cached for a year. Everything else is how a client finds them.
          aws s3 sync published/objects/ "s3://$BUCKET/repo/objects/" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --cache-control 'public, max-age=31536000, immutable'
          if [ -d published/deltas ]; then
            aws s3 sync published/deltas/ "s3://$BUCKET/repo/deltas/" \
              --endpoint-url "$ENDPOINT" --no-progress \
              --cache-control 'public, max-age=31536000, immutable'
          fi
          # The summary last, and only once everything it names is up. A
          # client that reads a summary listing objects that have not arrived
          # gets an install that fails halfway through.
          aws s3 sync published/ "s3://$BUCKET/repo/" \
            --endpoint-url "$ENDPOINT" --no-progress \
            --exclude 'objects/*' --exclude 'deltas/*' --exclude 'summary*' \
            --exclude 'tmp/*' --exclude '.lock' \
            --cache-control 'no-cache'
          # Whatever summary files this version of ostree wrote, rather than
          # the three that were named here: it also writes summary.idx.sig,
          # which a named list quietly left behind while looking complete.
          for f in published/summary*; do
            aws s3 cp "$f" "s3://$BUCKET/repo/$(basename "$f")" \
              --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache'
          done
          # What pruning removed, once nothing refers to it any more.
          # Never the summary: that one is uploaded above with a cache header
          # that says never to keep it, and a sync that decides to send it
          # again sends it without one. Which is what happened - the summary
          # was the one file on the remote with no Cache-Control on it.
          aws s3 sync published/ "s3://$BUCKET/repo/" \
            --endpoint-url "$ENDPOINT" --no-progress --delete --size-only \
            --exclude 'summary*' --exclude 'tmp/*' --exclude '.lock'

          # Regenerated every release from the key that just signed it, so the
          # two cannot come apart. It describes the remote rather than this
          # application, and is written by whichever project publishes last.
          ./packaging/flatpakrepo.sh "$BASE_URL" "$KEYID" > nsrosenqvist.flatpakrepo
          aws s3 cp nsrosenqvist.flatpakrepo "s3://$BUCKET/nsrosenqvist.flatpakrepo" \
            --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache' \
            --content-type 'application/vnd.flatpak.repo'
          # The one-command install: names this application rather than the
          # remote, and says where the GNOME runtime comes from, which is the
          # part that keeps "add Flathub first" out of the README.
          ./packaging/flatpakref.sh "$BASE_URL" "$KEYID" > riplika.flatpakref
          aws s3 cp riplika.flatpakref "s3://$BUCKET/riplika.flatpakref" \
            --endpoint-url "$ENDPOINT" --no-progress --cache-control 'no-cache' \
            --content-type 'application/vnd.flatpak.ref'

  release:
    name: Publish
    needs: [version, binaries, flatpak]
    runs-on: ubuntu-24.04
    steps:
      # The whole history, because the notes are written from it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -eu
          cd artifacts
          # Everything attached to the release, so anything downloaded from
          # it can be checked. Listing only some of them invites the
          # assumption that the rest were not worth checking.
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        # Allowed to fail. It calls a model over the network, and a release
        # that is built, checked, signed and published should not go
        # unannounced because that call did not come back - which is exactly
        # what happened when GitHub Models entered its retirement brownout and
        # started answering 410 to everything.
        continue-on-error: true
        uses: nsrosenqvist/chronikl@v1
        with:
          output: release_notes.md
          voice: prose
          rich_context: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHRONIKL_PROVIDER: github-models
          CHRONIKL_MODEL: openai/gpt-4o-mini

      - name: Notes from the metadata, if that did not write any
        # The notes a software centre shows are written by hand for every
        # version that has any, so there is always something true to say.
        run: |
          set -eu
          test -s release_notes.md && exit 0
          echo "no generated notes; using the ones in the AppStream metadata"
          ./packaging/release-notes.py \
            data/com.nsrosenqvist.Riplika.metainfo.xml \
            "${{ needs.version.outputs.version }}" > release_notes.md
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.flatpak
            artifacts/com.nsrosenqvist.Riplika.yml
            artifacts/cargo-sources.json
            artifacts/SHA256SUMS
