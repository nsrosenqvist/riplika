# What has to hold before a change is trusted.
#
# The jobs are split so a failure names its own cause: formatting, lints,
# tests, the translation catalogues, the flatpak source list, and the flatpak
# itself. The last one is slow - it builds ffmpeg and x264 from source - so it
# is cached, and waits for the tests rather than building a package out of code
# that does not pass them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A tag is not pushed to a branch, so none of this would otherwise run
  # against what is about to be released. Release calls it.
  workflow_call:

# A second push to the same branch makes the first one's answer irrelevant.
#
# The group is named rather than taken from `github.workflow`, which is the
# *caller's* name when this is run as part of a release - and a group shared
# with the caller would have this cancelling the workflow that started it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  clippy:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gui-build-deps
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gui-build-deps
      - uses: Swatinem/rust-cache@v2
      # The tests reach nothing outside themselves - every part of the outside
      # world is behind a trait with a fake - so no disc, drive, ffmpeg or even
      # a HOME is needed. Checked rather than hoped: the suite passes with
      # nothing on PATH but sh and cat. If that stops being true, it shows up
      # here as a test that only passes on a developer's machine.
      - run: cargo test --workspace --all-targets
      - name: Doc tests
        run: cargo test --workspace --doc

  catalogues:
    name: Translations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - name: Every string a person reads is in the template
        # Not by regenerating it: that needs an xgettext new enough to know
        # Rust, which is newer than the distributions carry, and building
        # gettext here would cost five minutes to answer a question that can
        # be asked of the source directly.
        run: ./po/check.py
      - name: Every catalogue compiles and none has holes
        # English is generated from the template, so a hole in it means the
        # generation is broken - and a missing catalogue is invisible in
        # English and only in English.
        run: |
          while read -r lang; do
            [ -n "$lang" ] || continue
            # Separate calls on purpose: piping msgfmt into tee would hide its
            # exit status, since pipefail is not on by default here.
            msgfmt --check "po/$lang.po" -o /dev/null
            msgfmt --statistics "po/$lang.po" -o /dev/null 2> /tmp/stats
            cat /tmp/stats
            if grep -qE 'untranslated|fuzzy' /tmp/stats; then
              echo "::error::po/$lang.po is incomplete - it is generated, so run ./po/build.sh"
              exit 1
            fi
          done < po/LINGUAS

  cargo-sources:
    name: Flatpak source list
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install aiohttp PyYAML tomlkit
      - name: The list still matches Cargo.lock
        # A stale list does not fail loudly - it pins the wrong versions - so
        # it is worth checking apart from the build that consumes it.
        run: |
          python3 packaging/flatpak-cargo-generator.py Cargo.lock -o packaging/cargo-sources.json
          if ! git diff --exit-code --stat packaging/cargo-sources.json; then
            echo "::error::packaging/cargo-sources.json is stale - run packaging/regenerate-cargo-sources.sh"
            exit 1
          fi

  flatpak:
    name: Packaging
    runs-on: ubuntu-24.04
    # No point building a package out of code that does not pass its own tests.
    needs: [test, cargo-sources]
    steps:
      - uses: actions/checkout@v7
      # Shared with the release workflow, which builds the same thing and
      # keeps a copy. One description of how this application is packaged.
      - uses: ./.github/actions/flatpak-build
