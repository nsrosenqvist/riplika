# What the GUI crate needs to compile: gtk4 >= 4.10 and libadwaita >= 1.5,
# both of which ubuntu-24.04 carries, plus gettext for the catalogues.
name: GUI build dependencies
description: Install the system libraries the GUI crate links against
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev libadwaita-1-dev libglib2.0-dev pkg-config gettext
