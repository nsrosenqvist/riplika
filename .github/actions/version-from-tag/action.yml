# Writing the tag's version into the manifests, before anything is built.
#
# The tag is the statement of what this release is; the files in the tree say
# 0.2.0 until told otherwise. Doing it here rather than in each workflow keeps
# one answer to "which line holds the version", which matters because the
# wrong line is a dependency's and moving that would be silent.
name: Version from tag
description: Set the workspace version from the tag being built
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -eu
        VERSION="${GITHUB_REF_NAME#v}"

        # The first `version = ` in the file is [workspace.package]'s, which
        # every crate here inherits. `0,/re/` stops at the first match; `1,/re/`
        # would start looking from the second line and is a different thing.
        sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
        echo "Cargo.toml now says: $(grep -m1 '^version = ' Cargo.toml)"

        # Cargo.lock names the workspace crates as well, and the flatpak builds
        # with CARGO_NET_OFFLINE set. Reconciling it here costs nothing - these
        # are path dependencies, so no network is involved - and leaves the
        # sandbox nothing to discover.
        cargo update --workspace --offline
